[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-gate"
dynamic = ["version"]
description = "Deterministic semantic permission and gating gateway for agent tools"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Semantic Gate contributors"}]
keywords = ["agents", "mcp", "permissions", "policy", "approval", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
approvals = ["cryptography>=42"]

[project.scripts]
semantic-gate-mcp = "semantic_gate.mcp:main"
semantic-gate-server = "semantic_gate.httpd:main"
semantic-gate-sign-approval = "semantic_gate.approvals:main"
semantic-gate-adapter-check = "semantic_gate.adapter_host:main"
semantic-gate-authorizations = "semantic_gate.authorization_admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "semantic_gate.__version__"}
